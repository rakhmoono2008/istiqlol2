[phases.setup]
nixPkgs = ["python311Full", "gcc", "nodejs_20", "nodePackages.npm"]

[phases.install]
cmds = [
  "python3.11 -m venv /app/venv",
  "/app/venv/bin/pip install -r backend/requirements.txt",
  "cd frontend && npm install"
]

[phases.build]
cmds = ["cd frontend && npm run build"]

[start]
cmd = "cd backend && /app/venv/bin/alembic upgrade head && /app/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT"
